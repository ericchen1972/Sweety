[project]
name = "sweety-app"
version = "2.0.1"
description = "Sweety macOS anti-scam desktop runtime"
requires-python = ">=3.11,<3.14"
dependencies = [
  "okline @ https://github.com/NiceDayZc/OkLine/archive/2e3437977368802edcc2219798b9d5333665ebca.zip",
  "qrcode[pil]>=7,<9",
  "keyring>=25.6.0",
  "cryptography>=46,<47",
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "requests>=2.32.0",
  "pydantic>=2.11.0",
  "openai>=2.14.0,<3",
]

[project.optional-dependencies]
desktop = [
  "Pillow>=11.0.0",
  "pyobjc-framework-Cocoa>=11.0; sys_platform == 'darwin'",
]
dev = [
  "httpx>=0.28.0",
  "pyinstaller>=6.15.0",
  "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sweety_app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true
